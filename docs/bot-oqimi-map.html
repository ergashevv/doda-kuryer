<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="utf-8" />

  <title>Bot oqimi</title>
  <style>
    :root {
      --bg: #071018;
      --panel: #131b23;
      --panel-2: #0f151c;
      --border: #3f566f;
      --text: #e8e6e3;
      --muted: #9aa7b3;
      --accent: #7dd3fc;
      --accent-2: #38bdf8;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(88, 211, 179, 0.12), transparent 26%),
        radial-gradient(circle at top right, rgba(240, 179, 94, 0.12), transparent 22%),
        linear-gradient(180deg, #08131d 0%, var(--bg) 100%);
      font-family: "Segoe UI", system-ui, sans-serif;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    .page {
      width: min(1800px, calc(100vw - 24px));
      margin: 0 auto;
      padding: 18px 0 40px;
    }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      padding: 12px 0 14px;
      margin-bottom: 16px;
      backdrop-filter: blur(10px);
    }
    .topbar-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      background: rgba(12, 18, 25, 0.92);
      border: 1px solid rgba(125, 211, 252, 0.2);
      border-radius: 16px;
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.28);
    }
    .title {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    h1 {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.2px;
    }
    .subtitle {
      color: var(--muted);
      font-size: 0.9rem;
    }
    .lang-switch {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .lang-switch button {
      appearance: none;
      border: 1px solid var(--border);
      background: #202831;
      color: var(--text);
      border-radius: 999px;
      padding: 0.72rem 1rem;
      min-width: 110px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.14s ease, border-color 0.14s ease, background 0.14s ease;
    }
    .lang-switch button:hover { transform: translateY(-1px); }
    .lang-switch button.active {
      border-color: var(--accent);
      background: rgba(125, 211, 252, 0.14);
      color: #fff;
      box-shadow: 0 0 0 1px rgba(125, 211, 252, 0.18) inset;
    }
    .content {
      display: flex;
      flex-direction: column;
      gap: 44px;
    }
    .diagram {
      overflow-x: auto;
      overflow-y: visible;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 2px;
    }
    .diagram .mermaid {
      min-width: 1180px;
      text-align: center;
    }
    .section-label {
      margin: 0 0 10px;
      color: #cdeafe;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.2px;
    }
    @media (max-width: 1024px) {
      .page { width: calc(100vw - 18px); }
      .content { gap: 34px; }
      .diagram .mermaid { min-width: 1060px; }
    }
    @media (max-width: 768px) {
      .page { width: calc(100vw - 14px); padding: 14px 0 28px; }
      .content { gap: 24px; }
      .diagram .mermaid { min-width: 900px; }
      .topbar-inner { align-items: flex-start; flex-direction: column; }
      .lang-switch { justify-content: flex-start; }
    }
    @media (max-width: 540px) {
      .page { width: calc(100vw - 10px); padding: 12px 0 22px; }
      .content { gap: 18px; }
      .diagram .mermaid { min-width: 760px; }
      .lang-switch button { min-width: 0; padding: 0.68rem 0.88rem; }
    }
  </style>
</head>

      const t = TEXT[lang];
      el.innerHTML = `
        <button type="button" class="${lang === "uz" ? "active" : ""}" data-lang="uz">${esc(t.btnUz)}</button>
        <button type="button" class="${lang === "ru" ? "active" : ""}" data-lang="ru">${esc(t.btnRu)}</button>
      `;
      el.querySelectorAll("button").forEach((btn) => {
        btn.addEventListener("click", () => setLang(btn.dataset.lang));
      });
    }

    function section(title, diagram) {
      return `
        <section class="diagram-wrap">
          <div class="section-label">${esc(title)}</div>
          <div class="diagram">
            <pre class="mermaid">${diagram}</pre>
          </div>
        </section>`;
    }

    async function render() {
      const lang = getLang();
      const t = TEXT[lang];

      document.documentElement.lang = lang;
      document.title = t.pageTitle;
      document.getElementById("pageTitle").textContent = t.pageTitle;
      document.getElementById("pageSubtitle").textContent = t.pageSubtitle;
      renderButtons(lang);

      const content = document.getElementById("content");
      content.innerHTML = [
        section(t.sections[0], t.diagram1),
        section(t.sections[1], t.diagram2),
        section(t.sections[2], t.diagram3),
      ].join("");

      mermaid.initialize({
        startOnLoad: false,
        theme: "base",
        securityLevel: "loose",
        themeVariables: {
          background: "transparent",
          primaryColor: "#2b3037",
          primaryBorderColor: "#79abd6",
          primaryTextColor: "#dedede",
          lineColor: "#d6d6d6",
          secondaryColor: "#2b3037",
          tertiaryColor: "#2b3037",
          fontFamily: '"Segoe UI", system-ui, sans-serif',
          fontSize: window.matchMedia("(max-width: 540px)").matches ? "12px" : window.matchMedia("(max-width: 768px)").matches ? "13px" : "15px",
        },
        flowchart: {
          curve: "basis",
          padding: window.matchMedia("(max-width: 540px)").matches ? 8 : window.matchMedia("(max-width: 768px)").matches ? 10 : 12,
          nodeSpacing: window.matchMedia("(max-width: 540px)").matches ? 20 : window.matchMedia("(max-width: 768px)").matches ? 26 : 34,
          rankSpacing: window.matchMedia("(max-width: 540px)").matches ? 36 : window.matchMedia("(max-width: 768px)").matches ? 44 : 54,
        },
      });

      await mermaid.run({ nodes: Array.from(content.querySelectorAll(".mermaid")) });
    }

    window.addEventListener("DOMContentLoaded", render);
  </script>
</body>
</html>
